var _authMode="login"; // login | register

function renderAuth(){

    +'<button class="auth-tab'+(_authMode==="login"?" on":"")+'" onclick="switchAuth(\'login\')">Iniciar sesión</button>'

  if(_authMode==="login"){

    h+='<div class="inp-lbl">Nombre completo</div><input id="a-name" class="inp" placeholder="Martín Díaz">'

      +'<button class="btn btn-orange" onclick="doRegister()" id="a-btn">Crear cuenta</button>'
      +'<div class="auth-link" onclick="switchAuth(\'login\')">Ya tengo cuenta</div>';
  }
  h+='<div class="auth-or">o</div>'
    +'<button class="btn btn-o" style="font-size:12px;color:var(--ink3)" onclick="enterDemo()">🎮 Modo demo (sin cuenta)</button>';
  card.innerHTML=h;
}

function switchAuth(mode){_authMode=mode;renderAuth()}

function authErr(msg){
  var el=document.getElementById("auth-err");
  if(el){el.textContent=msg;el.style.display=msg?"block":"none"}
}

async function doLogin(){
  var email=document.getElementById("a-email").value.trim();
  var pass=document.getElementById("a-pass").value;
  if(!email||!pass){authErr("Completá email y contraseña");return}
  authErr("");
  var btn=document.getElementById("a-btn");btn.textContent="Entrando...";btn.disabled=true;
  var res=await sb.auth.signInWithPassword({email:email,password:pass});
  if(res.error){authErr(res.error.message==="Invalid login credentials"?"Email o contraseña incorrectos":res.error.message);btn.textContent="Entrar";btn.disabled=false;return}
  SB_USER=res.data.user;
  await loadProfile();
}

async function doRegister(){
  var name=document.getElementById("a-name").value.trim();
  var email=document.getElementById("a-email").value.trim();
  var pass=document.getElementById("a-pass").value;
  if(!name){authErr("Ingresá tu nombre");return}
  if(!email){authErr("Ingresá tu email");return}
  if(pass.length<6){authErr("La contraseña debe tener al menos 6 caracteres");return}
  authErr("");
  var btn=document.getElementById("a-btn");btn.textContent="Creando cuenta...";btn.disabled=true;
  var res=await sb.auth.signUp({email:email,password:pass,options:{data:{name:name}}});
  if(res.error){authErr(res.error.message);btn.textContent="Crear cuenta";btn.disabled=false;return}
  SB_USER=res.data.user;
  // Show onboarding
  _onbData.name=name;
  showOnboarding();
}

async function loadProfile(){
  if(!SB_USER)return;
  var res=await sb.from("profiles").select("*").eq("id",SB_USER.id).single();
  if(res.data){
    SB_PROFILE=res.data;
    ROLE=SB_PROFILE.role;
    if(SB_PROFILE.club_id){
      // Load club data
      var clubRes=await sb.from("clubs").select("*").eq("id",SB_PROFILE.club_id).single();
      if(clubRes.data){CLUB.name=clubRes.data.name;CLUB.color=clubRes.data.color}
    }
    enterApp();
  }else{
    // No profile yet → onboarding
    _onbData.name=SB_USER.user_metadata?.name||"";
    showOnboarding();
  }
}

}

      });
      h+='</div>';
      h+='<button class="btn btn-orange" onclick="onbNext()">Crear club →</button>';
    }else if(_onbData.role==="dt"){
      h+='<div style="font-size:13px;font-weight:600;margin-bottom:12px;text-align:center">Uníte a un club</div>';
      h+='<div class="inp-lbl">Código de acceso (te lo da el coordinador)</div>';
      h+='<input id="onb-code" class="inp" placeholder="ABC123" style="font-family:var(--f-mono);letter-spacing:3px;text-align:center;font-size:18px" value="'+(_onbData.code||"")+'">';
      h+='<button class="btn btn-orange" onclick="onbNext()">Unirme →</button>';
      h+='<div class="auth-link" onclick="onbSkip()">Omitir por ahora</div>';
    }else{
      h+='<div style="font-size:13px;font-weight:600;margin-bottom:12px;text-align:center">Vincular a tu hijo</div>';
      h+='<div style="font-size:12px;color:var(--ink3);text-align:center;margin-bottom:16px;line-height:1.5">El DT te va a enviar un link de invitación para vincular a tu hijo con su equipo.</div>';
      h+='<div class="inp-lbl">Tu relación</div>';
      h+='<div style="display:flex;gap:8px;margin-bottom:12px">';
      ["Papá","Mamá","Tutor/a"].forEach(function(r){
        h+='<button class="chip '+(_onbData.rel===r?"chip-on":"chip-off")+'" onclick="pickOnbRel(\''+r+'\')">'+r+'</button>';
      });
      h+='</div>';
      h+='<button class="btn btn-orange" onclick="onbNext()">Continuar →</button>';
    }
    h+='<div class="auth-link" onclick="onbBack()">← Atrás</div>';

  }else if(_onbStep===3){
    h+='<div style="text-align:center;padding:12px 0">';
    h+='<div style="font-size:48px;margin-bottom:12px">🎉</div>';
    h+='<div style="font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">¡Todo listo!</div>';
    h+='<div style="font-size:13px;color:var(--ink3);line-height:1.5;margin-bottom:20px">'
      +(_onbData.role==="coord"?"Tu club <strong>"+(_onbData.clubName||"")+"</strong> está creado."
       :_onbData.role==="dt"?"Estás registrado como DT."
       :"Estás registrado como "+(_onbData.rel||"padre/madre")+".")
      +'</div>';
    h+='<button class="btn btn-orange" onclick="finishOnboarding()" id="onb-finish">Entrar a Squadra →</button>';
    h+='</div>';
  }
  card.innerHTML=h;
}

function pickOnbRole(r){_onbData.role=r;renderOnboarding()}
function pickOnbColor(c){_onbData.clubColor=c;renderOnboarding()}
function pickOnbRel(r){_onbData.rel=r;renderOnboarding()}
function onbBack(){if(_onbStep>1){_onbStep--;renderOnboarding()}}
function onbSkip(){_onbStep=3;renderOnboarding()}

async function onbNext(){
  if(_onbStep===1){
    _onbStep=2;renderOnboarding();return;
  }
  if(_onbStep===2){
    if(_onbData.role==="coord"){
      var cn=document.getElementById("onb-club");
      if(cn)_onbData.clubName=cn.value.trim();
      if(!_onbData.clubName){authErr("Poné el nombre del club");return}
    }else if(_onbData.role==="dt"){
      var ci=document.getElementById("onb-code");
      if(ci)_onbData.code=ci.value.trim().toUpperCase();
    }
    _onbStep=3;renderOnboarding();return;
  }
}

async function finishOnboarding(){
  var btn=document.getElementById("onb-finish");
  if(btn){btn.textContent="Configurando...";btn.disabled=true}

  try{
    if(_onbData.role==="coord"){
      // Create club
      var clubRes=await sb.from("clubs").insert({name:_onbData.clubName,color:_onbData.clubColor,owner_id:SB_USER.id}).select().single();
      if(clubRes.error)throw clubRes.error;
      // Create profile
      var profRes=await sb.from("profiles").insert({id:SB_USER.id,name:_onbData.name,role:"coord",club_id:clubRes.data.id}).select().single();
      if(profRes.error)throw profRes.error;
      SB_PROFILE=profRes.data;
      CLUB.name=_onbData.clubName;
      CLUB.color=_onbData.clubColor;
      ROLE="coord";
    }else if(_onbData.role==="dt"){
      // Try to find club by code
      var clubId=null;
      if(_onbData.code){
        var codeRes=await sb.from("access_codes").select("club_id").eq("code",_onbData.code).single();
        if(codeRes.data)clubId=codeRes.data.club_id;
      }
      var profRes=await sb.from("profiles").insert({id:SB_USER.id,name:_onbData.name,role:"dt",club_id:clubId}).select().single();
      if(profRes.error)throw profRes.error;
      SB_PROFILE=profRes.data;
      ROLE="dt";
    }else{
      var profRes=await sb.from("profiles").insert({id:SB_USER.id,name:_onbData.name,role:"padre",rel:_onbData.rel||"Papá"}).select().single();
      if(profRes.error)throw profRes.error;
      SB_PROFILE=profRes.data;
      ROLE="padre";
    }
    enterApp();
  }catch(e){
    console.error("Onboarding error:",e);
    authErr("Error: "+(e.message||"Intenta de nuevo"));
    if(btn){btn.textContent="Entrar a Squadra →";btn.disabled=false}
  }
}

// ============================================
// UUID ↔ INTEGER MAPPING (keeps onclick handlers working)
// ============================================
var _uuidMap={};  // uuid string → integer
var _intMap={};   // integer → uuid string
var _nextMappedId=1000; // start high to avoid clashing with demo data

function toInt(uuid){
  if(typeof uuid==='number')return uuid;
  if(uuid===null||uuid===undefined)return 0;
  var s=String(uuid);
  if(_uuidMap[s])return _uuidMap[s];
  var n=_nextMappedId++;
  _uuidMap[s]=n;
  _intMap[n]=s;
  return n;
}
function toUuid(intId){
  if(typeof intId==='string'&&intId.length>10)return intId; // already uuid
  return _intMap[intId]||intId;
}

async function sbLoadAll(){
  if(!sb||!SB_PROFILE||!SB_PROFILE.club_id){console.warn("sbLoadAll: no profile/club");return false}
  var clubId=SB_PROFILE.club_id;
  try{
    // 1. Load club
    var clubR=await sb.from('clubs').select('*').eq('id',clubId).single();
    if(clubR.data){
      CLUB.name=clubR.data.name;
      CLUB.color=clubR.data.color||'#1a7a3c';
      CLUB.seasonEndMonth=clubR.data.season_end_month||11;
      CLUB.inactivityDays=clubR.data.inactivity_days||45;
      CLUB._id=clubR.data.id;
    }

    // 2. Load staff pool
    var spR=await sb.from('staff_pool').select('*').eq('club_id',clubId);
    SP=(spR.data||[]).map(function(s){
      return{id:toInt(s.id),n:s.name,ini:s.initials,_uid:s.user_id,_uuid:s.id};
    });

    // 3. Load teams with nested players & team_staff
    var teamsR=await sb.from('teams').select('*').eq('club_id',clubId).order('created_at');
    var teamRows=teamsR.data||[];
    if(!teamRows.length){
      // New club, no teams yet
      TEAMS=[];TID=0;
      return true;
    }
    var teamIds=teamRows.map(function(t){return t.id});

    // 4. Load players for all teams at once
    var playersR=await sb.from('players').select('*').in('team_id',teamIds).order('number');
    var playersByTeam={};
    (playersR.data||[]).forEach(function(p){
      var tid=p.team_id;
      if(!playersByTeam[tid])playersByTeam[tid]=[];
      playersByTeam[tid].push(p);
    });

    // 5. Load team_staff for all teams
    var tsR=await sb.from('team_staff').select('*').in('team_id',teamIds);
    var staffByTeam={};
    (tsR.data||[]).forEach(function(ts){
      var tid=ts.team_id;
      if(!staffByTeam[tid])staffByTeam[tid]=[];
      staffByTeam[tid].push(ts);
    });

    // 6. Load convocations for all teams
    var convsR=await sb.from('convocations').select('*').in('team_id',teamIds).order('date',{ascending:false});
    var convsByTeam={};
    var convIds=[];
    (convsR.data||[]).forEach(function(cv){
      var tid=cv.team_id;
      if(!convsByTeam[tid])convsByTeam[tid]=[];
      convsByTeam[tid].push(cv);
      convIds.push(cv.id);
    });

    // 7. Load conv_players and chat for all convocations
    var cpR={data:[]},chatR={data:[]};
    if(convIds.length){
      var results=await Promise.all([
        sb.from('conv_players').select('*').in('conv_id',convIds),
        sb.from('chat_messages').select('*').in('conv_id',convIds).order('created_at')
      ]);
      cpR=results[0];chatR=results[1];
    }
    var cpByConv={},chatByConv={};
    (cpR.data||[]).forEach(function(cp){
      if(!cpByConv[cp.conv_id])cpByConv[cp.conv_id]=[];
      cpByConv[cp.conv_id].push(cp);
    });
    (chatR.data||[]).forEach(function(m){
      if(!chatByConv[m.conv_id])chatByConv[m.conv_id]=[];
      chatByConv[m.conv_id].push(m);
    });

    // 8. Load match_days
    var mdR={data:[]};
    if(convIds.length){
      mdR=await sb.from('match_days').select('*, match_events(*), match_presence(*)').in('conv_id',convIds);
    }
    var mdByConv={};
    (mdR.data||[]).forEach(function(md){mdByConv[md.conv_id]=md});

    // 9. Load history
    var histR=await sb.from('history').select('*').in('team_id',teamIds).order('date',{ascending:false});
    HIST={};
    (histR.data||[]).forEach(function(h){
      var tid=toInt(h.team_id);
      if(!HIST[tid])HIST[tid]=[];
      HIST[tid].push({
        id:toInt(h.id),rival:h.rival,fecha:h.date,tipo:'partido',
        res:{us:h.us_score,gc:h.them_score},
        ev:h.events||[],nota:h.notes||'',fotos:[],_uuid:h.id
      });
    });

    // 10. Build TEAMS array
    TEAMS=teamRows.map(function(td){
      var tid=toInt(td.id);
      var players=(playersByTeam[td.id]||[]).map(function(p){
        return{id:toInt(p.id),n:p.name,p:p.position,i:p.initials||'',num:p.number||0,_uuid:p.id};
      });
      var staff=(staffByTeam[td.id]||[]).map(function(ts){
        return{sid:toInt(ts.staff_id),rol:ts.role||'principal'};
      });

      // Build convocations
      var cvs=(convsByTeam[td.id]||[]).map(function(cd){
        var cvid=toInt(cd.id);
        var cpList=cpByConv[cd.id]||[];
        var jug=[],resp={},man={},late={};
        cpList.forEach(function(cp){
          var pid=toInt(cp.player_id);
          jug.push(pid);
          resp[pid]=cp.response||'pendiente';
          if(cp.manual)man[pid]=true;
          if(cp.late)late[pid]=true;
        });
        var chat=(chatByConv[cd.id]||[]).map(function(m){
          return{id:toInt(m.id),autor:m.author_name,rol:m.author_role||'padre',txt:m.text,t:'',_uuid:m.id};
        });
        var md=mdByConv[cd.id];
        return{
          id:cvid,tipo:cd.type,rival:cd.rival||'',fecha:cd.date,hora:cd.time||'10:00',
          lugar:cd.location||'',lim:cd.rsvp_limit||'',can:cd.cancelled||false,
          esp:cd.extras||{},logistica:cd.logistics||{},
          jug:jug,resp:resp,man:man,late:late,fotos:[],chat:chat,
          rsvpLog:{},_uuid:cd.id
        };
      });

      // Build match day from Supabase or default
      var mdData={pre:{},form:'3-3',slots:{},min:0,ev:[],us:0,them:0,res:''};
      // Use the first convocation's match_day if available
      if(cvs.length&&mdByConv[(convsByTeam[td.id]||[])[0]?.id]){
        var mdd=mdByConv[(convsByTeam[td.id]||[])[0].id];
        mdData={pre:{},form:mdd.formation||'3-3',slots:mdd.slots||{},
          min:mdd.minutes||0,ev:(mdd.match_events||[]).map(function(e){
            return{tipo:e.type,jid:toInt(e.player_id),desc:e.description||'',min:e.minute||0};
          }),
          us:mdd.us_score||0,them:mdd.them_score||0,res:'',
          _run:mdd.timer_running,_per:mdd.timer_period,_sec:mdd.timer_seconds
        };
      }

      // Calculate stats from history
      var hist=HIST[tid]||[];
      var sv=0,se=0,sd=0;
      hist.forEach(function(h){var r=h.res.us-h.res.gc;if(r>0)sv++;else if(r===0)se++;else sd++});

      return{
        id:tid,name:td.name,cat:td.category,anio:td.birth_year||'',
        tmp:td.season||'2026',color:td.color||'#1a7a3c',
        fmt:td.format||'7v7',dur:td.half_duration||25,
        staff:staff,j:players,cv:cvs,md:mdData,
        stats:{pj:hist.length,v:sv,e:se,d:sd,att:0},
        _uuid:td.id
      };
    });

    // Set TID to first team if available
    if(TEAMS.length)TID=TEAMS[0].id;

    // 11. Load children (for padre role)
    if(SB_PROFILE.role==='padre'){
      var chR=await sb.from('children').select('*, players(*, teams(*))').eq('parent_id',SB_USER.id);
      CHILDREN=(chR.data||[]).map(function(ch){
        return{
          id:toInt(ch.id),n:ch.name,
          tid:toInt(ch.player_id?ch.players?.team_id:0),
          jid:toInt(ch.player_id),
          ini:ch.name.split(' ').map(function(w){return w[0]||''}).slice(0,2).join('').toUpperCase(),
          parents:[{aid:1,name:SB_PROFILE.name,rel:SB_PROFILE.rel||''}],
          _uuid:ch.id
        };
      });
      ACCOUNTS=[{id:1,name:SB_PROFILE.name,rel:SB_PROFILE.rel||'',kids:CHILDREN.map(function(c){return c.id})}];
      if(CHILDREN.length)CID=CHILDREN[0].id;
    }

    // 12. Load access codes
    var codesR=await sb.from('access_codes').select('*').eq('club_id',clubId);
    CODES={};
    (codesR.data||[]).forEach(function(c){
      CODES[c.category+'_1']={code:c.code,_uuid:c.id};
    });

    // 13. Load tournaments
    var trnR=await sb.from('tournaments').select('*').eq('club_id',clubId);
    TORNEOS=(trnR.data||[]).map(function(t){
      return{id:toInt(t.id),name:t.name,org:t.organizer||'',fecha:t.date,
        loc:t.location||'',cats:t.categories||[],lim:t.team_limit||8,
        estado:t.status||'abierto',desc:t.description||'',inscr:{},_uuid:t.id};
    });

    // Init empty structures that don't exist in Supabase yet
    RESULTS={};SCORERS={};LIGA={};CATTEND={};
    DISP={};NOTAS={};ALERTS=[];

    console.log("sbLoadAll: loaded",TEAMS.length,"teams,",SP.length,"staff");
    return true;
  }catch(e){
    console.error("sbLoadAll failed:",e);
    return false;
  }
}

var _sbChannel=null;
function sbSubscribe(){
  if(!sb||!SB_MODE||_sbChannel)return;
  _sbChannel=sb.channel('squadra-realtime')
    .on('postgres_changes',{event:'*',schema:'public',table:'conv_players'},function(payload){
      // RSVP changed by another user → refresh
      console.log('RT conv_players:',payload);
      sbLoadAll().then(function(){render()});
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},function(payload){
      console.log('RT chat:',payload);
      var m=payload.new;
      // Skip own messages
      if(m.author_id===SB_USER.id)return;
      // Find convocation and append message
      for(var ti=0;ti<TEAMS.length;ti++){
        for(var ci=0;ci<TEAMS[ti].cv.length;ci++){
          var cv=TEAMS[ti].cv[ci];
          if(cv._uuid===m.conv_id){
            if(!cv.chat)cv.chat=[];
            cv.chat.push({id:toInt(m.id),autor:m.author_name,rol:m.author_role||'padre',txt:m.text,t:'',_uuid:m.id});
            render();
            toast('💬 '+m.author_name+': '+m.text.slice(0,30));
            return;
          }
        }
      }
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'match_days'},function(payload){
      console.log('RT match_days:',payload);
      // Live match updates from another device
      sbLoadAll().then(function(){render()});
    })
    .subscribe();
}
function sbUnsubscribe(){
  if(_sbChannel){sb.removeChannel(_sbChannel);_sbChannel=null}
}

function gT(id){for(var i=0;i<TEAMS.length;i++)if(TEAMS[i].id===(id||TID))return TEAMS[i];return TEAMS[0]}
function T(){return gT(TID)}
function gSt(id){for(var i=0;i<SP.length;i++)if(SP[i].id===id)return SP[i];return null}
// Prestamos: un jugador de otro equipo se referencia con id negativo -(idEquipoOrigen*1000 + idJugador)
function gid(tid,jid){return-(tid*1000+jid)}
function fJ(tmid,jid){
  if(jid<0){var st=Math.floor(-jid/1000),sj=(-jid)%1000,src=null;for(var k=0;k<TEAMS.length;k++)if(TEAMS[k].id===st)src=TEAMS[k];if(!src)return null;
    for(var q=0;q<src.j.length;q++)if(src.j[q].id===sj){var o={};for(var x in src.j[q])o[x]=src.j[q][x];o.id=jid;o.prest=src.id;return o}return null}
  var t=gT(tmid);for(var i=0;i<t.j.length;i++)if(t.j[i].id===jid)return t.j[i];return null}
function tEmo(t){var m=t&&t.name.match(/^(\S+)\s/);return m&&!/[A-Za-z0-9]/.test(m[1])?m[1]:""}
function prestBdg(j){if(!j||!j.prest)return"";var st=gT(j.prest);return'<span class="bdg" style="background:#eef6fb;color:#0B4A6F;border:1px solid #cfe6f3;margin-left:4px">'+tEmo(st)+' préstamo</span>'}
function loanTeams(t){return TEAMS.filter(function(x){return x.id!==t.id&&x.cat===t.cat})}
// Aviso al DT del equipo de origen (en la demo, a la campana)
function notifyLoans(t,cv,prev){var nuevos=cv.jug.filter(function(id){return id<0&&(!prev||prev.indexOf(id)===-1)});
  nuevos.forEach(function(id){var j=fJ(t.id,id);if(!j)return;var st=gT(j.prest);var dt=st.staff[0]?gSt(st.staff[0].sid):null;
    ALERTS.unshift({id:Date.now()+Math.random(),tipo:"prest",msg:tEmo(t)+" "+t.name.replace(/^\S+\s/,"")+" convocó a "+j.n+" (de "+st.name+") para "+cv.rival+" · "+fmt(cv.fecha)+(dt?" · aviso a "+dt.n:""),f:"Ahora",read:false})});
  return nuevos.length}
// Iniciales del equipo para avatares: t.ini si existe, si no la ultima palabra del nombre (max 3 letras)
function tIni(t){return t.ini||t.name.split(" ").pop().slice(0,3)}
// Minimo de confirmados para dar el equipo por "listo" (configurable por equipo; si no, el formato)
function minConf(t){return t.minConf||fmtMin(t.fmt)}
function cvCount(cv){var c={si:0,no:0,pd:0};cv.jug.forEach(function(id){var r=cv.resp[id]||"pendiente";if(r==="si")c.si++;else if(r==="no")c.no++;else c.pd++});return c}
// Proximo partido/gira/torneo (sin entrenamientos), hoy o despues
function matchCV(tmid){var t=gT(tmid||TID),best=null;for(var i=0;i<t.cv.length;i++){var c=t.cv[i];if(c.can||c.cerrado||c.fecha<TODAY||c.tipo==="entrenamiento")continue;if(!best||c.fecha<best.fecha||(c.fecha===best.fecha&&(c.hora||"")<(best.hora||"")))best=c}return best}
// Equipos del DT actual (el DT principal del equipo activo)
function myTeams(){var t=T();var sid=t.staff[0]?t.staff[0].sid:null;var a=TEAMS.filter(function(x){return x.staff.some(function(s){return s.sid===sid})});return a.length?a:[t]}
function faltanTxt(t){var cv=matchCV(t.id);if(!cv)return"Sin convocatoria";var c=cvCount(cv),m=minConf(t);return c.si>=m?"Listo · "+c.si+"/"+m:c.si+"/"+m+" · faltan "+(m-c.si)}
function remindPend(cvid){var t=T(),cv=fCV(TID,cvid);if(!cv)return;
var pend=cv.jug.filter(function(id){return(cv.resp[id]||"pendiente")==="pendiente"}).map(function(id){return fJ(TID,id)}).filter(Boolean);
if(!pend.length){toast("No hay pendientes");return}
var c=cvCount(cv),m=minConf(t);
var txt=t.name+" "+cv.rival+"\n📅 "+fmt(cv.fecha)+" · "+horaTxt(cv)+"\n🏟️ "+cv.lugar+"\n\nFaltan confirmar:\n"+pend.map(function(j){return"• "+j.n}).join("\n")+(cv.tipo!=="entrenamiento"?"\n\nVamos "+c.si+" de "+m+".":"")+" Por favor respondan en Squadra 🙏";
window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank")}
// Hora de citacion: la guardada, o 15 min antes del inicio (no aplica a entrenamientos)
function citDef(h){if(!h||h.indexOf(":")<0)return"";var p=h.split(":"),m=parseInt(p[0],10)*60+parseInt(p[1],10)-15;if(m<0)m+=1440;var hh=Math.floor(m/60),mm=m%60;return(hh<10?"0":"")+hh+":"+(mm<10?"0":"")+mm}
function citOf(cv){if(!cv||cv.tipo==="entrenamiento")return"";return cv.cit||(cv.logistica&&cv.logistica.horaEnc)||citDef(cv.hora)}
function horaTxt(cv){var c=citOf(cv);return c?"Citación "+c+" · "+(cv.tipo==="partido"?"Partido":"Inicio")+" "+cv.hora+"hs":cv.hora+"hs"}

// Returns sorted past convocations for a team (by date asc, only fecha <= TODAY and not cancelled)
function pastCVs(tid){
  var t=gT(tid);
  return t.cv.filter(function(cv){return cv.fecha<=TODAY&&!cv.can})
    .sort(function(a,b){return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0});
}

// Get attendance dots data for a player
// Returns: { ent: [{ok:bool},...], partidos: [{convoked:bool, ok:bool},...], pctE:num, pctP:num, totalE:num, totalP:num, okE:num, okP:num }
function getAttDots(tid,jid){
  var all=pastCVs(tid);
  var allParts=all.filter(function(cv){return cv.tipo==="partido"||cv.tipo==="gira"});
  var allEnt=all.filter(function(cv){return cv.tipo==="entrenamiento"});

  // Entrenamientos since last COMPLETED match
  // "Last completed match" = second-to-last partido if the last one is today, otherwise last partido
  var ent=[];
  var refMatch=null;
  if(allParts.length>=2){
    refMatch=allParts[allParts.length-2]; // penultimate match
  }
  // Show trainings AFTER refMatch date (or all trainings if no refMatch)
  allEnt.forEach(function(cv){
    if(refMatch&&cv.fecha<=refMatch.fecha)return; // skip trainings before reference match
    var convoked=cv.jug.indexOf(jid)!==-1;
    var resp=cv.resp[jid];
    ent.push({ok:convoked&&resp==="si"});
  });

  // Last 5 partidos (most recent last)
  var partidos=[];
  var last5=allParts.slice(-5);
  last5.forEach(function(cv){
    var convoked=cv.jug.indexOf(jid)!==-1;
    var resp=cv.resp[jid];
    partidos.push({convoked:convoked,ok:convoked&&resp==="si"});
  });

  // Overall stats
  var totE=allEnt.length,okE=0,totP=allParts.length,okP=0;
  allEnt.forEach(function(cv){if(cv.jug.indexOf(jid)!==-1&&cv.resp[jid]==="si")okE++});
  allParts.forEach(function(cv){if(cv.jug.indexOf(jid)!==-1&&cv.resp[jid]==="si")okP++});
  return{ent:ent,partidos:partidos,pctE:totE?Math.round(okE/totE*100):0,pctP:totP?Math.round(okP/totP*100):0,totalE:totE,totalP:totP,okE:okE,okP:okP};
}

// Render attendance dots HTML for a player (compact, for wizard/lists)
function renderAttDots(tid,jid){
  var d=getAttDots(tid,jid);
  if(!d.ent.length&&!d.partidos.length)return'<span style="font-size:11px;color:var(--ink4)">Sin historial</span>';
  var h='<div class="att-dots">';
  // Entrenamientos since last match
  if(d.ent.length){
    h+='<div style="display:flex;flex-direction:column;align-items:center;gap:1px">';
    h+='<div class="att-dot-grp">';
    d.ent.forEach(function(e){
      h+='<div class="att-d '+(e.ok?"si":"no-e")+'"></div>';
    });
    h+='</div>';
    h+='<div style="font-size:11px;font-weight:700;color:var(--ink4);letter-spacing:.5px">ENT</div>';
    h+='</div>';
  }
  if(d.ent.length&&d.partidos.length)h+='<div class="att-sep"></div>';
  // Last 5 partidos
  if(d.partidos.length){
    h+='<div style="display:flex;flex-direction:column;align-items:center;gap:1px">';
    h+='<div class="att-dot-grp">';
    d.partidos.forEach(function(p){
      if(!p.convoked)h+='<div class="att-d nc"></div>';
      else if(p.ok)h+='<div class="att-d si"></div>';
      else h+='<div class="att-d no-p"></div>';
    });
    h+='</div>';
    h+='<div style="font-size:11px;font-weight:700;color:var(--ink4);letter-spacing:.5px">PART</div>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function cp(txt,bid){
  function ok(){var b=document.getElementById(bid);if(b){var o=b.textContent;b.textContent="✓ Copiado";setTimeout(function(){b.textContent=o},2000)}else toast("✓ Copiado")}
  // Respaldo cuando el portapapeles no esta disponible (archivo local, permisos): textarea + execCommand
  function legacy(){try{var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var r=document.execCommand("copy");document.body.removeChild(ta);if(r)ok();else prompt("Copiá el link:",txt)}catch(e){prompt("Copiá el link:",txt)}}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,legacy)}else legacy();
}

function recordRsvp(cv,jid,resp,acct){
  if(!cv.rsvpLog)cv.rsvpLog={};if(!cv.rsvpLog[jid])cv.rsvpLog[jid]=[];
  cv.rsvpLog[jid]=cv.rsvpLog[jid].filter(function(e){return e.aid!==acct.id});
  var now=new Date();var days=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  var t=days[now.getDay()]+" "+(now.getHours()<10?"0":"")+now.getHours()+":"+(now.getMinutes()<10?"0":"")+now.getMinutes();
  cv.rsvpLog[jid].push({aid:acct.id,name:acct.name,rel:acct.rel,resp:resp,t:t});
  cv.resp[jid]=resp;if(!cv.man)cv.man={};if(!cv.late)cv.late={};
  if(afLimit(cv)){cv.late[jid]=true;delete cv.man[jid]}else{cv.man[jid]=true;delete cv.late[jid]}
  if(SB_MODE&&cv._uuid){sbSaveConvPlayer(cv._uuid,toUuid(jid),resp)}
}

function rEspStrip(cv,editable){
  if(!cv.esp||cv.tipo==='entrenamiento')return'';
  var parts=[];
  if(cv.esp.entrada==='gratis')parts.push('🆓 Entrada gratis');
  else if(cv.esp.entrada==='pago')parts.push('🎟 Entrada: '+(cv.esp.entradaMonto||'paga'));
  if(cv.esp.estac==='gratis')parts.push('🅿 Estac. gratis');
  else if(cv.esp.estac==='pago')parts.push('💰 Estac.: '+(cv.esp.estacMonto||'pago'));
  else if(cv.esp.estac==='no')parts.push('🚫 Sin estac.');

}else if(ROLE==="dt"){

function fmtMin(fmt){
  
  if(fmt==="11v11")return 11;
  if(fmt==="8v8")return 8;
  if(fmt==="7v7")return 7;
  if(fmt==="6v6")return 6;
  if(fmt==="5v5")return 5;
  return 7;
}

function teamStatus(t){
  var cv=matchCV(t.id);
  if(!cv)return"sin_conv";
  var si=cvCount(cv).si;
  var min=minConf(t);
  return si>=min?"listo":"corto";
}

function rCoordClub(){

  var listos=[],cortos=[],sinConv=[];
  TEAMS.forEach(function(t){
    var s=teamStatus(t);
    if(s==="listo")listos.push(t);
    else if(s==="corto")cortos.push(t);
    else sinConv.push(t);
  });

  var h='<div class="sec">';

  // Greeting

    +'</div>';

  h+='<div style="display:flex;gap:7px;margin-bottom:12px">';
  var chips=[
    {k:"todos",  lb:"Todos",     n:TEAMS.length,   bg:"#f0f0f0",   tc:"var(--ink2)", ac:"#1e293b"},
    {k:"listos", lb:"✅ Listos",  n:listos.length,  bg:"#e8f5ec",   tc:"#1a7a3c",    ac:"#1a7a3c"},
    {k:"cortos", lb:"⚠ Cortos",  n:cortos.length,  bg:"#fef9e7",   tc:"#9a7d0a",    ac:"#9a7d0a"},
    {k:"sin_conv",lb:"— Sin conv",n:sinConv.length, bg:"#f5f5f5",   tc:"var(--ink4)", ac:"var(--ink3)"}

  var allAssigned=[];TEAMS.forEach(function(tm){tm.staff.forEach(function(s){if(allAssigned.indexOf(s.sid)===-1)allAssigned.push(s.sid)})});
  SP.forEach(function(st,i){var isAssigned=allAssigned.indexOf(st.id)!==-1;

var _calView="week"; 

function rCoordCalendario(){
  
  var today=new Date(TODAY);
  var dow=today.getDay();var diff=dow===0?-6:1-dow;
  var monday=new Date(today);monday.setDate(today.getDate()+diff);
  var days=[];
  for(var i=0;i<7;i++){var d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d)}
  var dayNames=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  var monthNames=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

  
  var evByDate={};
  TEAMS.forEach(function(t){
    t.cv.forEach(function(cv){
      if(cv.can)return;
      if(!evByDate[cv.fecha])evByDate[cv.fecha]=[];
      evByDate[cv.fecha].push({cv:cv,t:t});
    });
  });

  var h='<div style="background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between">'
    +'<div>'
    +'<div style="font-size:15px;font-weight:800;color:var(--ink)">'+dayNames[0]+' '+days[0].getDate()+' — '+dayNames[6]+' '+days[6].getDate()+' '+monthNames[days[0].getMonth()]+'</div>'
    +'<div style="font-size:11px;color:var(--ink3);margin-top:1px">Semana actual · '+Object.keys(evByDate).length+' eventos</div>'
    +'</div>'
    +'<button class="btn-sm" onclick="openCoordWz()">+ Convocar</button>'
    +'</div>';

  
  h+='<div style="display:flex;background:#fff;border-bottom:1px solid var(--border)">';
  days.forEach(function(d,i){
    var ds=d.toISOString().split('T')[0];
    var isToday=ds===TODAY;
    var hasEv=!!(evByDate[ds]&&evByDate[ds].length);
    h+='<div style="flex:1;padding:8px 4px;text-align:center;cursor:pointer;border-bottom:2px solid '+(isToday?'var(--tc)':'transparent')+'" onclick="scrollToDay(\'day-'+ds+'\')">'
      +'<div style="font-size:11px;font-weight:600;color:'+(isToday?'var(--tc)':'var(--ink3)')+';text-transform:uppercase">'+dayNames[i]+'</div>'
      +'<div style="font-size:15px;font-weight:'+(isToday?'800':'600')+';color:'+(isToday?'var(--tc)':'var(--ink)')+';margin-top:2px">'+d.getDate()+'</div>'
      +(hasEv?'<div style="display:flex;justify-content:center;gap:2px;margin-top:3px">'
        +(evByDate[ds]||[]).slice(0,3).map(function(ev){return'<div style="width:5px;height:5px;border-radius:50%;background:'+ev.t.color+'"></div>'}).join('')
        +'</div>':'<div style="height:11px"></div>')
      +'</div>'
  });
  h+='</div>';

  
  h+='<div class="sec" style="padding-top:12px">';
  var hasAny=false;
  days.forEach(function(d,i){
    var ds=d.toISOString().split('T')[0];
    var evs=evByDate[ds]||[];
    var isToday=ds===TODAY;
    if(!evs.length&&!isToday)return; 
    hasAny=true;
    h+='<div id="day-'+ds+'" style="margin-bottom:14px">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">'
      +'<div style="font-size:12px;font-weight:700;color:'+(isToday?'var(--tc)':'var(--ink2)')+'">'+dayNames[i]+' '+d.getDate()+' '+monthNames[d.getMonth()]+'</div>'
      +(isToday?'<span class="bdg bdg-hoy" style="font-size:11px">HOY</span>':'')
      +'</div>';

    if(!evs.length){
      h+='<div style="font-size:12px;color:var(--ink4);font-style:italic;padding:10px 0">Sin eventos programados.</div>'
    }else{
      evs.sort(function(a,b){return a.cv.hora>b.cv.hora?1:-1});

function waText(cv,t){
  var dias=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  var d=new Date(cv.fecha+"T12:00:00"),p=cv.fecha.split("-");
  var emo=(t.name.match(/^(\S+)\s/)||["",""])[1];var nom=t.name.replace(/^\S+\s/,"");if(!emo){emo="";nom=t.name}
  var rival=cv.rival.replace(/^vs\.\s*/i,"");
  var L=[];
  if(cv.tipo==="entrenamiento")L.push(nom.toUpperCase()+(emo?" "+emo:"")+" · 🏃 Entrenamiento");
  else L.push(nom.toUpperCase()+(emo?" "+emo:"")+" 🆚 "+rival);
  L.push("");
  L.push("📅 "+dias[d.getDay()]+" "+parseInt(p[2],10)+"/"+parseInt(p[1],10));
  var c=citOf(cv);
  L.push("⏰ "+(c?c+" citados (partido "+cv.hora+")":cv.hora+"hs"));
  L.push("🏟️ "+cv.lugar);
  L.push("");
  var n=0;cv.jug.forEach(function(jid){var j=fJ(t.id,jid);if(j){n++;L.push(n+". "+j.n+(j.prest?" ("+tEmo(gT(j.prest))+")":""))}});
  L.push("");

  return L.join("\n");
}

function buildField(cc,fmts){
  var t=T();var md=t.md;var rows=fmts[md.form];if(!rows){var k=Object.keys(fmts);rows=fmts[k[0]]}
  var W=340,H=400,g="#3a7d44",gl="#2f6b3a";var tr=rows.length;var yp=[];

  for(var r=0;r<rows.length;r++){var cnt=rows[r][0],cy=yp[r];for(var c=0;c<cnt;c++){var cx=Math.round(W*(c+1)/(cnt+1));var lb=r===0?"POR":r===rows.length-1?"DEL":r===1?"DEF":"MED";slots.push({k:"s"+si,cx:cx,cy:cy,lb:lb});si++}}

    +'<rect width="'+W+'" height="'+H+'" fill="'+g+'"/>'
    +'<rect x="14" y="14" width="'+(W-28)+'" height="'+(H-28)+'" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>'
    +'<line x1="14" y1="'+Math.round(H/2)+'" x2="'+(W-14)+'" y2="'+Math.round(H/2)+'" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>'
    +'<circle cx="'+Math.round(W/2)+'" cy="'+Math.round(H/2)+'" r="28" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>'
    +'<circle cx="'+Math.round(W/2)+'" cy="'+Math.round(H/2)+'" r="3" fill="rgba(255,255,255,0.4)"/>'
    +sv
    +'</svg></div>'

function rChat(cv,myRol,myName,myColor){

  if(!cv.chat.length)msgs='<div style="text-align:center;padding:16px;color:var(--ink4);font-size:12px">💬 Sin mensajes todavía.</div>';
  else cv.chat.forEach(function(m){
    var isMe=(m.autor===myName);var isDT=(m.rol==="dt");
    var bub=isMe?"me":isDT?"dt":"them";
    var avbg=isMe?myColor:isDT?"#1e293b":"#888";
    var ini=m.autor.split(" ").map(function(w){return w[0]||""}).slice(0,2).join("");

function udSnd(cvid){var i=document.getElementById("ci"+cvid),b=document.getElementById("cs"+cvid);if(i&&b)b.disabled=!i.value.trim()}

function sendChat(cvid){
  var ctx=window["_cc_"+cvid];if(!ctx)return;
  var i=document.getElementById("ci"+cvid);var txt=i?i.value.trim():(CHATD[cvid]||"").trim();if(!txt)return;

  var now=new Date();var days=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

function rmFoto(e,cvid,fi){

function calcTabla(tn){
  var eq=tn.equipos||[];var pts=tn.partidos||[];
  var tabla={};
  eq.forEach(function(e){tabla[e]={pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0}});
  pts.forEach(function(p){
    if(!tabla[p.local])tabla[p.local]={pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0};
    if(!tabla[p.visit])tabla[p.visit]={pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0};
    var l=tabla[p.local],v=tabla[p.visit];
    l.pj++;v.pj++;l.gf+=p.gl;l.gc+=p.gv;v.gf+=p.gv;v.gc+=p.gl;
    if(p.gl>p.gv){l.pg++;l.pts+=3;v.pp++}
    else if(p.gl<p.gv){v.pg++;v.pts+=3;l.pp++}
    else{l.pe++;v.pe++;l.pts++;v.pts++}
  });
  var arr=Object.keys(tabla).map(function(e){return{name:e,s:tabla[e]}});
  arr.sort(function(a,b){return b.s.pts-a.s.pts||(b.s.gf-b.s.gc)-(a.s.gf-a.s.gc)||b.s.gf-a.s.gf});
  return arr;
}

function shareConv(cvid,tid){
var t=gT(tid||TID),cv=fCV(tid||TID,cvid);if(!cv)return;
var W=600,pad=24,H=180+(cv.jug.length*30)+60;
var canvas=document.createElement("canvas");canvas.width=W;canvas.height=H;
var ctx=canvas.getContext("2d");
ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
ctx.fillStyle=t.color||"#1a7a3c";ctx.fillRect(0,0,W,140);
ctx.fillStyle="rgba(255,255,255,.7)";ctx.font="bold 11px sans-serif";ctx.fillText("CONVOCATORIA",pad,30);
ctx.fillStyle="#fff";ctx.font="bold 24px sans-serif";ctx.fillText(t.name,pad,60);
ctx.fillStyle="rgba(255,255,255,.6)";ctx.font="13px sans-serif";ctx.fillText(t.cat,pad,82);
ctx.fillStyle="#fff";ctx.font="bold 20px sans-serif";ctx.fillText(cv.rival,pad,110);
ctx.font="12px sans-serif";ctx.fillStyle="rgba(255,255,255,.7)";
ctx.fillText(fmtFull(cv.fecha)+" - "+horaTxt(cv)+" - "+(cv.lugar||""),pad,128);
var y=158;
ctx.fillStyle="#555";ctx.font="bold 11px sans-serif";ctx.fillText("CONVOCADOS ("+cv.jug.length+")",pad,y);y+=16;
cv.jug.forEach(function(jid,idx){
var j=fJ(t.id,jid);if(!j)return;
var rsvp=cv.resp[jid]||"pendiente";
if(idx%2===0){ctx.fillStyle="#f9f9f9";ctx.fillRect(0,y,W,26);}
var dc=rsvp==="si"?"#1a7a3c":rsvp==="no"?"#e84040":"#f0c000";
ctx.beginPath();ctx.arc(pad+4,y+13,4,0,Math.PI*2);ctx.fillStyle=dc;ctx.fill();
ctx.fillStyle="#111";ctx.font="13px sans-serif";ctx.fillText(j.n,pad+16,y+17);
ctx.fillStyle="#aaa";ctx.font="11px sans-serif";ctx.fillText(j.p,W-pad-60,y+17);
y+=26;});
ctx.fillStyle=t.color||"#1a7a3c";ctx.fillRect(0,y+8,W,42);
ctx.fillStyle="rgba(255,255,255,.8)";ctx.font="bold 13px sans-serif";ctx.fillText("Responde en Squadra",pad,y+32);
var dataUrl=canvas.toDataURL("image/png");
var previewHtml='<div style="padding:13px">';
previewHtml+='<img src="'+dataUrl+'" style="width:100%;border-radius:8px;display:block;margin-bottom:13px">';
previewHtml+='<a href="'+dataUrl+'" download="squadra-conv.png" style="display:block;padding:11px;border-radius:10px;background:var(--tc);color:#fff;text-align:center;font-weight:700;font-size:13px;text-decoration:none">Descargar imagen</a>';
previewHtml+='</div>';
showOverlay(mHdr("Compartir convocatoria")+'<div class="modal-body" style="padding:0">'+previewHtml+'</div>');}
