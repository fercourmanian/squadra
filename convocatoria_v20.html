function recordRsvp(cv,jid,resp,acct){
  if(!cv.rsvpLog)cv.rsvpLog={};if(!cv.rsvpLog[jid])cv.rsvpLog[jid]=[];
  cv.rsvpLog[jid]=cv.rsvpLog[jid].filter(function(e){return e.aid!==acct.id});
  var now=new Date();var days=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  var t=days[now.getDay()]+" "+(now.getHours()<10?"0":"")+now.getHours()+":"+(now.getMinutes()<10?"0":"")+now.getMinutes();
  cv.rsvpLog[jid].push({aid:acct.id,name:acct.name,rel:acct.rel,resp:resp,t:t});
  cv.resp[jid]=resp;if(!cv.man)cv.man={};if(!cv.late)cv.late={};
  if(afLimit(cv)){cv.late[jid]=true;delete cv.man[jid]}else{cv.man[jid]=true;delete cv.late[jid]}
}

function rEspStrip(cv,editable){
  if(!cv.esp||cv.tipo==='entrenamiento')return'';
  var parts=[];
  if(cv.esp.entrada==='gratis')parts.push('🆓 Entrada gratis');
  else if(cv.esp.entrada==='pago')parts.push('🎟 Entrada: '+(cv.esp.entradaMonto||'paga'));
  if(cv.esp.estac==='gratis')parts.push('🅿 Estac. gratis');
  else if(cv.esp.estac==='pago')parts.push('💰 Estac.: '+(cv.esp.estacMonto||'pago'));
  else if(cv.esp.estac==='no')parts.push('🚫 Sin estac.');
  if(!parts.length)return'';
  var edit=editable?'<button class="btn-sm" style="margin-left:auto;flex-shrink:0" onclick="openWz('+cv.id+',null)">✏ Editar</button>':'';
  return'<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:9px 13px;background:#f8f9f8;border-top:1px solid var(--border);font-size:11px;font-weight:600;color:var(--ink2)">'
    +parts.map(function(p){return'<span>'+p+'</span>'}).join('<span style="color:var(--ink4)">·</span>')
    +edit+'</div>';
}

var _clubFilter="todos";
function setCF(f){_clubFilter=f;render()} 

function fmtMin(fmt){
  
  if(fmt==="11v11")return 11;
  if(fmt==="7v7")return 7;
  if(fmt==="6v6")return 6;
  if(fmt==="5v5")return 5;
  return 7;
}

function teamStatus(t){
  var cv=actCV(t.id);
  if(!cv)return"sin_conv";
  var si=0;cv.jug.forEach(function(id){if((cv.resp[id]||"pd")==="si")si++});
  var min=fmtMin(t.fmt);
  return si>=min?"listo":"corto";
}

function rCoordClub(){
  
  var listos=[],cortos=[],sinConv=[];
  TEAMS.forEach(function(t){
    var s=teamStatus(t);
    if(s==="listo")listos.push(t);
    else if(s==="corto")cortos.push(t);
    else sinConv.push(t);
  });

  var h='<div class="sec">';

  
  h+='<div style="display:flex;gap:7px;margin-bottom:12px">';
  var chips=[
    {k:"todos",  lb:"Todos",     n:TEAMS.length,   bg:"#f0f0f0",   tc:"var(--ink2)", ac:"#1e293b"},
    {k:"listos", lb:"✅ Listos",  n:listos.length,  bg:"#e8f5ec",   tc:"#1a7a3c",    ac:"#1a7a3c"},
    {k:"cortos", lb:"⚠ Cortos",  n:cortos.length,  bg:"#fef9e7",   tc:"#9a7d0a",    ac:"#9a7d0a"},
    {k:"sin_conv",lb:"— Sin conv",n:sinConv.length, bg:"#f5f5f5",   tc:"var(--ink4)", ac:"var(--ink3)"}
  ];
  chips.forEach(function(c){
    var on=_clubFilter===c.k;
    h+='<button onclick="setCF(this.dataset.k)" data-k="'+c.k+'" style="flex:1;padding:9px 4px;border-radius:var(--radius-sm);border:'+(on?'2px solid '+c.ac:'1px solid var(--border)')+';background:'+(on?c.bg:'#fff')+';cursor:pointer;font-family:inherit;transition:all .15s">'
      +'<div style="font-size:16px;font-weight:800;color:'+(on?c.ac:'var(--ink2)')+'">'+c.n+'</div>'
      +'<div style="font-size:9px;font-weight:600;color:'+(on?c.ac:'var(--ink4)')+';text-transform:uppercase;letter-spacing:.3px;margin-top:2px">'+c.lb+'</div>'
      +'</button>';
  });
  h+='</div>';
  h+='<div class="slbl">Pool de técnicos del club</div><div class="card" style="margin-bottom:10px">';
  var assigned=t.staff.map(function(s){return s.sid});
  SP.forEach(function(st,i){var isAssigned=assigned.indexOf(st.id)!==-1;
    h+='<div class="card-row" style="border-bottom:'+(i<SP.length-1?'1px solid #f8f8f8':'none')+'">'
      +'<div style="width:32px;height:32px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#374151">'+st.ini+'</div>'
      +'<div style="flex:1;margin-left:8px;font-size:13px;font-weight:600">'+st.n+'</div>'
      +(isAssigned?'<span class="bdg bdg-si">Asignado</span>'
       :'<button class="btn-sm" onclick="addStaff('+t.id+','+st.id+')">+ Asignar</button>')
      +'</div>'
  });
  h+='</div>';
  h+='<button class="btn btn-o" onclick="openNewStaff()">+ Agregar técnico al club</button>';
  return h+'</div>'
}

var _calView="week"; 

function rCoordCalendario(){
  
  var today=new Date(TODAY);
  var dow=today.getDay();var diff=dow===0?-6:1-dow;
  var monday=new Date(today);monday.setDate(today.getDate()+diff);
  var days=[];
  for(var i=0;i<7;i++){var d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d)}
  var dayNames=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  var monthNames=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

  
  var evByDate={};
  TEAMS.forEach(function(t){
    t.cv.forEach(function(cv){
      if(cv.can)return;
      if(!evByDate[cv.fecha])evByDate[cv.fecha]=[];
      evByDate[cv.fecha].push({cv:cv,t:t});
    });
  });

  var h='<div style="background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between">'
    +'<div>'
    +'<div style="font-size:15px;font-weight:800;color:var(--ink)">'+dayNames[0]+' '+days[0].getDate()+' — '+dayNames[6]+' '+days[6].getDate()+' '+monthNames[days[0].getMonth()]+'</div>'
    +'<div style="font-size:11px;color:var(--ink3);margin-top:1px">Semana actual · '+Object.keys(evByDate).length+' eventos</div>'
    +'</div>'
    +'<button class="btn-sm" onclick="openCoordWz()">+ Convocar</button>'
    +'</div>';

  
  h+='<div style="display:flex;background:#fff;border-bottom:1px solid var(--border)">';
  days.forEach(function(d,i){
    var ds=d.toISOString().split('T')[0];
    var isToday=ds===TODAY;
    var hasEv=!!(evByDate[ds]&&evByDate[ds].length);
    h+='<div style="flex:1;padding:8px 4px;text-align:center;cursor:pointer;border-bottom:2px solid '+(isToday?'var(--tc)':'transparent')+'" onclick="scrollToDay(\'day-'+ds+'\')">'
      +'<div style="font-size:9px;font-weight:600;color:'+(isToday?'var(--tc)':'var(--ink3)')+';text-transform:uppercase">'+dayNames[i]+'</div>'
      +'<div style="font-size:15px;font-weight:'+(isToday?'800':'600')+';color:'+(isToday?'var(--tc)':'var(--ink)')+';margin-top:2px">'+d.getDate()+'</div>'
      +(hasEv?'<div style="display:flex;justify-content:center;gap:2px;margin-top:3px">'
        +(evByDate[ds]||[]).slice(0,3).map(function(ev){return'<div style="width:5px;height:5px;border-radius:50%;background:'+ev.t.color+'"></div>'}).join('')
        +'</div>':'<div style="height:11px"></div>')
      +'</div>'
  });
  h+='</div>';

  
  h+='<div class="sec" style="padding-top:12px">';
  var hasAny=false;
  days.forEach(function(d,i){
    var ds=d.toISOString().split('T')[0];
    var evs=evByDate[ds]||[];
    var isToday=ds===TODAY;
    if(!evs.length&&!isToday)return; 
    hasAny=true;
    h+='<div id="day-'+ds+'" style="margin-bottom:14px">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">'
      +'<div style="font-size:12px;font-weight:700;color:'+(isToday?'var(--tc)':'var(--ink2)')+'">'+dayNames[i]+' '+d.getDate()+' '+monthNames[d.getMonth()]+'</div>'
      +(isToday?'<span class="bdg bdg-hoy" style="font-size:9px">HOY</span>':'')
      +'</div>';

    if(!evs.length){
      h+='<div style="font-size:12px;color:var(--ink4);font-style:italic;padding:10px 0">Sin eventos programados.</div>'
    }else{
      evs.sort(function(a,b){return a.cv.hora>b.cv.hora?1:-1});
      evs.forEach(function(item){
        var cv=item.cv;var t=item.t;
        var si=0;cv.jug.forEach(function(id){if((cv.resp[id]||'pd')==='si')si++});
        var pct=cv.jug.length?Math.round(si/cv.jug.length*100):0;
        var icon=cv.tipo==='torneo'?'🏆':cv.tipo==='partido'?'⚽':'🏃';
        h+='<div class="card" style="margin-bottom:8px">'
          +'<div style="display:flex;align-items:stretch">'
          +'<div style="width:4px;background:'+t.color+';border-radius:4px 0 0 4px;flex-shrink:0"></div>'
          +'<div style="flex:1;padding:10px 12px">'
            +'<div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">'
            +'<span style="font-size:16px">'+icon+'</span>'
            +'<div style="flex:1;min-width:0">'
              +'<div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+cv.rival+'</div>'
              +'<div style="font-size:11px;color:var(--ink3);margin-top:1px">'+t.name+' · '+cv.hora+'hs · '+cv.lugar+'</div>'
            +'</div>'

function cancelCV(cvid){if(!confirm("¿Cancelar?"))return;var cv=fCV(TID,cvid);if(cv){cv.can=true;}render();toast("❌ Cancelada")}
function restoreCV(cvid){var cv=fCV(TID,cvid);if(cv)cv.can=false;render();toast("✅ Restaurada")}
function cycleR(cvid,jid){
  var cv=fCV(TID,cvid);if(!cv)return;
  var cur=cv.resp[jid]||"pendiente";var nx=cur==="pendiente"?"si":cur==="si"?"no":"pendiente";
  cv.resp[jid]=nx;if(!cv.man)cv.man={};if(!cv.late)cv.late={};
  if(nx==="pendiente"){delete cv.man[jid];delete cv.late[jid]}
  else if(afLimit(cv)){cv.late[jid]=true;delete cv.man[jid]}
  else{cv.man[jid]=true;delete cv.late[jid]}
  render();var j=fJ(TID,jid);toast(nx==="si"?"✅ "+j.n.split(" ")[0]+" SÍ":nx==="no"?"❌ "+j.n.split(" ")[0]+" NO":"↩ "+j.n.split(" ")[0]+" pendiente")
}

    var pc=ch&&ch.parents?ch.parents.length:0;
    var bid="sh"+jid;
    var msg="Hola! "+j.n+" est\u00e1 convocado con "+t.name+" para "+cv.rival+" el "+fmt(cv.fecha)+" "+cv.hora+"hs en "+cv.lugar+". https://"+invLink(TID,jid);
    window["_im_"+bid]=msg;
    rows+='<div class="card-row">'+av(j,26,t.color)

  var cv=null;for(var i=0;i<t.cv.length;i++)if(!t.cv[i].can&&t.cv[i].fecha===TODAY){cv=t.cv[i];break}
  if(!cv){
    
    var nextCv=null;for(var i=0;i<t.cv.length;i++)if(!t.cv[i].can){nextCv=t.cv[i];break}
    var h='<div class="sec"><div class="empty"><div class="empty-ic">📅</div><div class="empty-ttl">Sin partido hoy</div>'
      +(nextCv?'<div class="empty-sub">Próximo partido: '+nextCv.rival+'<br>'+fmt(nextCv.fecha)+' · '+nextCv.hora+'hs</div>':'<div class="empty-sub">No hay partidos programados próximamente.</div>')
      +'</div></div>';
    return h
  }
  var md=t.md;var rival=cv.rival.replace(/vs\.\s*/i,"");
  var us=md.us||0,th=md.them||0;var diff=us-th;
  var result=diff>0?"🏆 Ganando":diff===0?"🤝 Empate":"😤 Perdiendo";
  var tmin=Math.floor(TMR.sec/60)+(TMR.per===2?t.dur:0);var tss=TMR.sec%60;
  var tstr=(tmin<10?"0":"")+tmin+":"+(tss<10?"0":"")+tss;
  var ptabs=["live","form","presentes","stats","fotos"];
  var ptlbls=["En vivo","Formación","Plantel","Stats","📷 Fotos"];
  var tabbar='<div style="display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto">';
  ptabs.forEach(function(tab,i){tabbar+='<button style="flex-shrink:0;padding:10px 13px;font-size:11px;font-weight:'+(_pMDTab===tab?"700":"500")+';color:'+(_pMDTab===tab?"var(--tc)":"var(--ink3)")+';border:none;background:none;cursor:pointer;font-family:inherit;border-bottom:2px solid '+(_pMDTab===tab?"var(--tc)":"transparent")+'" onclick="_pMDTab=\''+tab+'\';render()">'+ptlbls[i]+'</button>'});
  tabbar+='</div>';
  
  var hero='<div class="md-score-card">'
    +(TMR.run?'<div style="display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border-radius:12px;padding:3px 10px;font-size:10px;font-weight:600;margin-bottom:5px"><div class="live-dot"></div>EN VIVO</div><br>'
             :'<div style="font-size:10px;opacity:.45;margin-bottom:4px">'+fmt(cv.fecha)+' · '+cv.hora+'hs</div>')
    +'<div class="md-teams"><span>'+t.name+'</span><span>'+rival+'</span></div>'
    +'<div class="md-score">'+us+' — '+th+'</div>'
    +'<div class="md-result">'+result+'</div>'
    +(TMR.sec>0?'<div style="font-size:11px;color:rgba(255,255,255,.4);margin-top:4px">⏱ '+tstr+' · '+(TMR.per===1?"1er":"2do")+" tiempo</div>":'')
    +'</div>';
  var body="";var h='<div class="sec">'+hero+'</div>'+tabbar+'<div class="sec">';
  if(_pMDTab==="live"){
    var evs=md.ev||[];
    if(!evs.length)body='<div class="empty" style="padding:14px 0"><div class="empty-ic" style="font-size:28px">⏳</div><div class="empty-sub">Sin eventos registrados todavía.</div></div>';
    else{body='<div class="slbl">Eventos</div><div class="card">';evs.slice().reverse().forEach(function(e){var j=e.jid?fJ(t.id,e.jid):null;var ic=e.tipo==="gol"?"⚽":e.tipo==="amarilla"?"🟨":e.tipo==="roja"?"🟥":"🔄";var txt=e.tipo==="cambio"?e.desc:j?j.n.split(" ")[0]+" — "+e.tipo:"Gol del rival";body+='<div class="ev-row"><div class="ev-min">'+e.min+"'</div><div class=\"ev-ic\">"+ic+'</div><div style="flex:1;font-size:12px">'+txt+'</div></div>'});body+='</div>'}
    var cn=cv.chat?cv.chat.length:0;body+='<div class="slbl" style="margin-top:14px">💬 Reacciones '+(cn?'<span class="chat-cnt">'+cn+'</span>':'')+'</div><div class="card">'+rChat(cv,"padre",ch.n,t.color)+'</div>'
  }else if(_pMDTab==="form"){
    var assigned=[];for(var k in md.slots){var j=fJ(t.id,md.slots[k]);if(j)assigned.push(j)}
    if(md.form){body='<div class="slbl">Formación · '+md.form+'</div>';var cc2=cv.jug.filter(function(id){return cv.resp[id]==="si"});body+=buildField(cc2,FF[t.fmt]||FF["7v7"])}else body='<div class="empty"><div class="empty-sub">El DT aún no configuró la formación.</div></div>'
  }else if(_pMDTab==="presentes"){
    var here=[],absent=[],unk=[];cv.jug.forEach(function(id){var j=fJ(t.id,id);if(!j)return;var s=md.pre[id];if(s===true)here.push(j);else if(s===false)absent.push(j);else unk.push(j)});
    body='<div style="display:flex;gap:7px;margin-bottom:11px"><div style="flex:1;text-align:center;padding:10px;background:#e8f5ec;border-radius:var(--radius-sm)"><div style="font-size:20px;font-weight:800;color:#1a7a3c">'+here.length+'</div><div style="font-size:9px;color:#1a7a3c;text-transform:uppercase;margin-top:2px">Presentes</div></div><div style="flex:1;text-align:center;padding:10px;background:#fde8e8;border-radius:var(--radius-sm)"><div style="font-size:20px;font-weight:800;color:#e84040">'+absent.length+'</div><div style="font-size:9px;color:#e84040;text-transform:uppercase;margin-top:2px">Ausentes</div></div></div>';
    if(here.length){body+='<div class="slbl">En cancha</div><div class="card">';here.forEach(function(j){body+='<div class="card-row">'+av(j,26,t.color)+'<div style="flex:1;margin-left:6px"><div class="pl-name" style="font-size:12px">'+j.n+'</div><div class="pl-sub">'+j.p+'</div></div><span class="bdg bdg-si">✓</span></div>'});body+='</div>'}
    if(absent.length){body+='<div class="slbl" style="margin-top:10px">Ausentes</div><div class="card">';absent.forEach(function(j){body+='<div class="card-row" style="opacity:.6">'+av(j,26,"#e84040")+'<div style="flex:1;margin-left:6px"><div class="pl-name" style="font-size:12px">'+j.n+'</div></div><span class="bdg bdg-no">✗</span></div>'});body+='</div>'}
  }else if(_pMDTab==="stats"){
    var rows=[{lbl:"Posesión",us:58,them:42,u:"%"},{lbl:"Tiros al arco",us:us*2+2,them:th*2+1,u:""},{lbl:"Córners",us:Math.max(1,us+1),them:Math.max(0,th),u:""},{lbl:"Amarillas",us:(md.ev||[]).filter(function(e){return e.tipo==="amarilla"}).length,them:0,u:""}];
    body='<div class="slbl">'+t.name+' vs '+rival+'</div>';
    rows.forEach(function(s){var tot=s.us+s.them||1;var pct=Math.round(s.us/tot*100);body+='<div class="sbar-row"><div class="sbar-labels"><span style="color:var(--tc)">'+s.us+s.u+'</span><span style="color:var(--ink3)">'+s.lbl+'</span><span style="color:#e84040">'+s.them+s.u+'</span></div><div class="sbar"><div class="sbar-fill" style="width:'+pct+'%"></div></div></div>'});
    var goals=(md.ev||[]).filter(function(e){return e.tipo==="gol"&&e.jid});
    if(goals.length){var gcnt={};goals.forEach(function(e){gcnt[e.jid]=(gcnt[e.jid]||0)+1});body+='<div class="slbl" style="margin-top:5px">Goleadores</div><div class="card">';Object.keys(gcnt).forEach(function(jid){var j=fJ(t.id,parseInt(jid));if(!j)return;body+='<div class="card-row">'+av(j,26,t.color)+'<div style="flex:1;margin-left:6px;font-size:12px;font-weight:500">'+j.n+'</div><span style="font-size:14px;font-weight:800;color:var(--tc)">'+gcnt[jid]+' ⚽</span></div>'});body+='</div>'}
  }else{
    body='<div class="slbl">Fotos del encuentro</div>'+rFotos(cv,"padre",ch.n)
  }
  return h+body+'</div>'
}

  var h='<div class="prof-section">'
    +'<div style="text-align:center;padding:8px 0 20px">'

    +'<div style="font-size:17px;font-weight:700">'+acct.name+'</div>'
    +'<div style="font-size:12px;color:var(--ink3);margin-top:3px">'+acct.rel+'</div>'
    +'<button class="btn-sm" style="margin-top:10px" onclick="openAcctSw()">Cambiar perfil ▾</button>'
    +'</div>';
  
  h+='<div class="slbl">Mis hijos</div>';

    var ch=gCh(kid);var t=gT(ch.tid);
    h+='<div class="card card-p" style="margin-bottom:8px;display:flex;align-items:center;gap:10px">'
      +'<div class="av" style="width:38px;height:38px;font-size:13px;background:'+t.color+'">'+ch.ini+'</div>'
      +'<div style="flex:1"><div style="font-size:13px;font-weight:700">'+ch.n+'</div><div style="font-size:11px;color:var(--ink3);margin-top:1px">'+t.name+' · '+t.cat+'</div></div>'
      +'<button class="btn-sm" onclick="CID='+kid+';NAV=1;applyTheme();render()">Ver →</button>'

  });

  acct.kids.forEach(function(kid){
    var ch=gCh(kid);
    ch.parents.filter(function(p){return p.aid!==ACCT_ID}).forEach(function(p){
      h+='<div class="card card-p" style="margin-bottom:8px;display:flex;align-items:center;gap:10px">'
        +'<div style="width:36px;height:36px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#374151">'+p.name.split(" ").map(function(w){return w[0]}).join("").slice(0,2)+'</div>'
        +'<div style="flex:1"><div style="font-size:13px;font-weight:600">'+p.name+'</div><div style="font-size:11px;color:var(--ink3)">'+p.rel+' de '+ch.n.split(" ")[0]+'</div></div>'
        +'</div>'
    })
  });

    +'</div>';

function rChat(cv,myRol,myName,myColor){
  if(!cv.chat)cv.chat=[];
  var cvid=cv.id;
  window["_cc_"+cvid]={rol:myRol,n:myName,c:myColor};
  var msgs="";
  if(!cv.chat.length)msgs='<div style="text-align:center;padding:16px;color:var(--ink4);font-size:12px">💬 Sin mensajes todavía.</div>';
  else cv.chat.forEach(function(m){
    var isMe=(m.autor===myName);var isDT=(m.rol==="dt");
    var bub=isMe?"me":isDT?"dt":"them";
    var avbg=isMe?myColor:isDT?"#1e293b":"#888";
    var ini=m.autor.split(" ").map(function(w){return w[0]||""}).slice(0,2).join("");
    msgs+='<div class="msg'+(isMe?" me":"")+'">'
      +'<div class="msg-av" style="background:'+avbg+'">'+ini+'</div>'
      +'<div class="msg-body"><div class="msg-who'+(isMe?" me":"")+'">'+m.autor+(isDT?'<span class="msg-dt-badge">DT</span>':'')+'</div>'
      +'<div class="msg-bub '+bub+'">'+m.txt+'</div></div>'
      +'<div class="msg-t">'+m.t+'</div></div>'
  });
  var draft=CHATD[cvid]||"";
  return'<div class="chat-area" id="cm'+cvid+'">'+msgs+'</div>'
    +'<div class="chat-bar">'
    +'<textarea id="ci'+cvid+'" class="chat-inp" rows="1" placeholder="Escribí un mensaje..." oninput="CHATD['+cvid+']=this.value;udSnd('+cvid+')" onkeydown="ckd(event,'+cvid+')">'+draft+'</textarea>'
    +'<button id="cs'+cvid+'" class="chat-send" onclick="sendChat('+cvid+')"'+(draft.trim()?'':' disabled')+'>➤</button>'
    +'</div>'
}
function udSnd(cvid){var i=document.getElementById("ci"+cvid),b=document.getElementById("cs"+cvid);if(i&&b)b.disabled=!i.value.trim()}
function ckd(e,cvid){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat(cvid)}}
function sendChat(cvid){
  var ctx=window["_cc_"+cvid];if(!ctx)return;
  var i=document.getElementById("ci"+cvid);var txt=i?i.value.trim():(CHATD[cvid]||"").trim();if(!txt)return;
  var cv=null;for(var ti=0;ti<TEAMS.length;ti++)for(var ci=0;ci<TEAMS[ti].cv.length;ci++)if(TEAMS[ti].cv[ci].id===cvid){cv=TEAMS[ti].cv[ci];break}
  if(!cv)return;if(!cv.chat)cv.chat=[];
  var now=new Date();var days=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  cv.chat.push({id:Date.now(),autor:ctx.n,rol:ctx.rol,txt:txt,t:days[now.getDay()]+" "+(now.getHours()<10?"0":"")+now.getHours()+":"+(now.getMinutes()<10?"0":"")+now.getMinutes()});
  CHATD[cvid]="";render();
  setTimeout(function(){var el=document.getElementById("cm"+cvid);if(el)el.scrollTop=el.scrollHeight},50);
  toast("💬 Mensaje enviado")
}

function rFotos(cv,rol,uname){
  if(!cv.fotos)cv.fotos=[];if(!_FMOM[cv.id])_FMOM[cv.id]="partido";
  var mom=_FMOM[cv.id];var cvid=cv.id;
  var filtered=cv.fotos.filter(function(f){return f.mom===mom});
  window["_un_"+cvid]=uname;
  var tabs='<div class="foto-tabs">'
    +'<button class="chip '+(mom==="partido"?"chip-on":"chip-off")+'" onclick="_FMOM['+cvid+']=\'partido\';render()">⚽ Durante</button>'
    +'<button class="chip '+(mom==="post"?"chip-on":"chip-off")+'" onclick="_FMOM['+cvid+']=\'post\';render()">🎉 Post partido</button>'
    +'</div>';
  var grid='<div class="foto-grid">';
  filtered.forEach(function(f,fi){
    grid+='<div class="foto-item" onclick="viewFoto('+cvid+','+fi+')"><img src="'+f.data+'"><button class="foto-del" onclick="rmFoto(event,'+cvid+','+fi+')">✕</button></div>'
  });
  var finput='<input type="file" accept="image' + String.fromCharCode(47) + '*" multiple style="display:none" onchange="addFotos('+cvid+',this)">';
  grid+='<label class="foto-add"><span style="font-size:18px">📷</span><span>Agregar</span>'+finput+'</label></div>';
  if(!filtered.length)grid+='<div style="text-align:center;padding:8px;font-size:11px;color:var(--ink4)">Sin fotos '+(mom==="partido"?"del partido":"post partido")+'</div>';
  return tabs+grid
}
function addFotos(cvid,input){
  var cv=null;for(var ti=0;ti<TEAMS.length;ti++)for(var ci=0;ci<TEAMS[ti].cv.length;ci++)if(TEAMS[ti].cv[ci].id===cvid){cv=TEAMS[ti].cv[ci];break}
  if(!cv||!input.files.length)return;
  if(!cv.fotos)cv.fotos=[];var mom=_FMOM[cvid]||"partido";var autor=window["_un_"+cvid]||"?";
  var files=Array.from(input.files);var n=0;
  files.forEach(function(file){var r=new FileReader();r.onload=function(e){var now=new Date();cv.fotos.push({data:e.target.result,autor:autor,mom:mom,t:(now.getHours()<10?"0":"")+now.getHours()+":"+(now.getMinutes()<10?"0":"")+now.getMinutes()});n++;if(n===files.length){render();toast("📷 "+n+" foto"+(n>1?"s":"")+" subida"+(n>1?"s":""))}};r.readAsDataURL(file)})
}
function rmFoto(e,cvid,fi){
  e.stopPropagation();
  for(var ti=0;ti<TEAMS.length;ti++)for(var ci=0;ci<TEAMS[ti].cv.length;ci++)if(TEAMS[ti].cv[ci].id===cvid){var cv=TEAMS[ti].cv[ci];if(!cv.fotos)return;var mom=_FMOM[cvid]||"partido";var filtered=cv.fotos.filter(function(f){return f.mom===mom});var target=filtered[fi];if(target)cv.fotos=cv.fotos.filter(function(f){return f!==target});render();return}
}
function viewFoto(cvid,fi){
  var cv=null;for(var ti=0;ti<TEAMS.length;ti++)for(var ci=0;ci<TEAMS[ti].cv.length;ci++)if(TEAMS[ti].cv[ci].id===cvid){cv=TEAMS[ti].cv[ci];break}
  if(!cv||!cv.fotos)return;var mom=_FMOM[cvid]||"partido";var filtered=cv.fotos.filter(function(f){return f.mom===mom});var foto=filtered[fi];if(!foto)return;
  document.getElementById("overlay-root").innerHTML='<div class="overlay" onclick="closeOverlay()" style="background:rgba(0,0,0,.92)"><div style="width:100%;max-width:430px;padding:16px"><img src="'+foto.data+'" style="width:100%;border-radius:11px;display:block"><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><div style="font-size:11px;color:rgba(255,255,255,.55)">📷 '+foto.autor+' · '+foto.t+'</div><button onclick="closeOverlay()" style="background:rgba(255,255,255,.15);border:none;border-radius:16px;padding:5px 13px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit">Cerrar</button></div></div></div>'
}

function getHist(tmid){return HIST[tmid||TID]||[]}
function rHistList(tmid,readOnly){
  var items=getHist(tmid);
  if(!items.length)return'<div class="empty" style="padding:16px 0"><div class="empty-ic" style="font-size:28px">📋</div><div class="empty-sub">Sin partidos anteriores.</div></div>';
  var h="";
  items.forEach(function(item){
    var res=histRes(item);var rc=res==="V"?"#1a7a3c":res==="E"?"#9a7d0a":"#c0392b";
    var isOpen=_HOPEN[item.id];var rival=item.rival.replace(/vs\.\s*/i,"");
    h+='<div class="hist-card">'
      +'<div class="hist-hdr" onclick="_HOPEN[\''+item.id+'\']=!_HOPEN[\''+item.id+'\'];render()">'
      +'<div class="hist-res res-'+res+'">'+res+'</div>'
      +'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;color:var(--ink)">'+rival+'</div><div style="font-size:11px;color:var(--ink3);margin-top:1px">'+fmt(item.fecha)+'</div></div>'
      +'<div style="font-size:16px;font-weight:800;color:'+rc+'">'+item.res.us+' — '+item.res.gc+'</div>'
      +'<div style="font-size:11px;color:var(--ink4);margin-left:6px">'+(isOpen?"▲":"▼")+'</div>'
      +'</div>';
    if(isOpen){
      h+='<div class="hist-body">';
      if(item.ev&&item.ev.length){h+='<div class="slbl" style="margin-bottom:6px">Eventos</div>';item.ev.forEach(function(e){var ic=e.tipo==="gol"?"⚽":e.tipo==="amarilla"?"🟨":e.tipo==="roja"?"🟥":"🔄";h+='<div class="ev-row"><div class="ev-min">'+e.min+"'</div><div class=\"ev-ic\">"+ic+'</div><div style="flex:1;font-size:12px">'+e.desc+'</div></div>'})}
      if(item.nota)h+='<div class="hist-nota">💬 '+item.nota+'</div>';
      else if(!readOnly)h+='<textarea class="inp" rows="2" style="resize:none;margin-top:9px;font-style:italic;font-size:12px" placeholder="Agregar nota..." onchange="saveHistNota(\''+item.id+'\',this.value,'+tmid+')"></textarea>';
      
      h+='<div class="slbl" style="margin-top:11px;margin-bottom:7px">📷 Fotos</div><div class="hfoto-strip">';
      (item.fotos||[]).forEach(function(f,fi){h+='<img class="hfoto-mini" src="'+f.data+'" onclick="viewHistFoto(\''+item.id+'\','+fi+')">'});
      if(!readOnly){var hfinput='<input type="file" accept="image'+String.fromCharCode(47)+'*" multiple style="display:none" onchange="addHistFotos(\''+item.id+'\',this,'+tmid+')">';h+='<label class="hfoto-btn">📷'+hfinput+'</label>'}
      if(!(item.fotos&&item.fotos.length))h+='<div style="font-size:11px;color:var(--ink4);font-style:italic;padding:10px 0">Sin fotos</div>';
      h+='</div></div>'
    }
    h+='</div>'
  });
  return h
}

function saveHistNota(hid,nota,tmid){var items=getHist(tmid);for(var i=0;i<items.length;i++)if(items[i].id===hid){items[i].nota=nota;break}toast("✅ Nota guardada")}
function addHistFotos(hid,input,tmid){var items=getHist(tmid);var item=null;for(var i=0;i<items.length;i++)if(items[i].id===hid){item=items[i];break}if(!item)return;if(!item.fotos)item.fotos=[];var files=Array.from(input.files);var n=0;files.forEach(function(file){var r=new FileReader();r.onload=function(e){item.fotos.push({data:e.target.result,autor:"DT",t:"",rival:item.rival,fecha:item.fecha});n++;if(n===files.length){_HOPEN[hid]=true;render();toast("📷 "+n+" foto"+(n>1?"s":"")+" agregada"+(n>1?"s":""))}};r.readAsDataURL(file)})}
function viewHistFoto(hid,fi){var foto=null;for(var tmid in HIST){var items=HIST[tmid];for(var i=0;i<items.length;i++)if(items[i].id===hid&&items[i].fotos){foto=items[i].fotos[fi];break}if(foto)break}if(!foto)return;document.getElementById("overlay-root").innerHTML='<div class="overlay" onclick="closeOverlay()" style="background:rgba(0,0,0,.92)"><div style="width:100%;max-width:430px;padding:16px"><img src="'+foto.data+'" style="width:100%;border-radius:11px;display:block"><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><div style="font-size:11px;color:rgba(255,255,255,.55)">📷 '+foto.rival.replace(/vs\.\s*/i,"")+'</div><button onclick="closeOverlay()" style="background:rgba(255,255,255,.15);border:none;border-radius:16px;padding:5px 13px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit">Cerrar</button></div></div></div>'}

applyTheme();
render();
